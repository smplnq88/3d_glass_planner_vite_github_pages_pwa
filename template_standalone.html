<body class="bg-gradient-to-br from-emerald-50/70 via-slate-50 to-teal-50/50 min-h-screen text-slate-800 antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-300">

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const CUBE_ICON_SRC = "__CUBE_BASE64_PLACEHOLDER__";

    // --- Web Audio API 알람 사운드 엔진 ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    function playAlarmSound(soundType = "zen_bell") {
      try {
        const ctx = getAudioContext();
        if (ctx.state === "suspended") ctx.resume();

        let isStopped = false;
        const activeNodes = [];

        const playTone = (freq, startTime, duration, type = "sine", volume = 0.25, filterFreq = 0) => {
          if (isStopped) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          let lastNode = osc;

          if (filterFreq > 0) {
            const filter = ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(filterFreq, startTime);
            osc.connect(filter);
            lastNode = filter;
            activeNodes.push(filter);
          }

          lastNode.connect(gain);
          gain.connect(ctx.destination);

          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + Math.min(0.08, duration * 0.15));
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.start(startTime);
          osc.stop(startTime + duration);
          activeNodes.push(osc, gain);
        };

        const triggerSequence = () => {
          const now = ctx.currentTime;
          switch (soundType) {
            case "digital_beep":
              playTone(880, now, 0.1, "square", 0.12);
              playTone(880, now + 0.15, 0.1, "square", 0.12);
              playTone(880, now + 0.7, 0.1, "square", 0.12);
              playTone(880, now + 0.85, 0.1, "square", 0.12);
              break;
            case "morning_harp":
              playTone(261.63, now, 0.8, "triangle", 0.18);
              playTone(293.66, now + 0.12, 0.8, "triangle", 0.18);
              playTone(329.63, now + 0.24, 0.8, "triangle", 0.18);
              playTone(392.00, now + 0.36, 1.2, "triangle", 0.18);
              playTone(440.00, now + 0.48, 1.2, "triangle", 0.18);
              playTone(523.25, now + 0.60, 1.5, "triangle", 0.18);
              break;
            case "cosmic_synth":
              playTone(220.00, now, 2.5, "sawtooth", 0.15, 600);
              playTone(277.18, now + 0.1, 2.5, "sawtooth", 0.12, 600);
              playTone(329.63, now + 0.2, 2.5, "sawtooth", 0.12, 600);
              playTone(493.88, now + 0.3, 2.5, "sawtooth", 0.10, 600);
              break;
            case "zen_bell":
            default:
              playTone(329.63, now, 1.5, "sine", 0.22);
              playTone(392.00, now + 0.2, 1.5, "sine", 0.22);
              playTone(523.25, now + 0.4, 2.0, "sine", 0.22);
              playTone(659.25, now + 0.6, 2.5, "sine", 0.22);
              break;
          }
        };

        triggerSequence();
        const loopDuration = soundType === "digital_beep" ? 2000 : 3500;
        const intervalId = setInterval(() => {
          if (isStopped) return;
          triggerSequence();
        }, loopDuration);

        return () => {
          isStopped = true;
          clearInterval(intervalId);
          activeNodes.forEach(n => {
            try { n.disconnect(); } catch (e) {}
          });
        };
      } catch (e) {
        console.warn("Audio error:", e);
        return () => {};
      }
    }

    // --- 반복 알람 다음 시각 계산 유틸리티 ---
    function toLocalISOString(date) {
      const pad = (num) => (num < 10 ? "0" : "") + num;
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function getNextAlarmTime(originalAlarmTime, repeatType, repeatDays = [], referenceTime = new Date(), repeatInterval = 30) {
      if (!originalAlarmTime || repeatType === "none" || !repeatType) return null;
      const start = new Date(originalAlarmTime);
      if (isNaN(start.getTime())) return null;

      const originalHours = start.getHours();
      const originalMinutes = start.getMinutes();
      let candidate = new Date(start.getTime());

      if (repeatType !== "minute" && repeatType !== "hour") {
        candidate.setHours(originalHours, originalMinutes, 0, 0);
      } else {
        candidate.setSeconds(0, 0);
      }

      const interval = repeatInterval && repeatInterval > 0 ? repeatInterval : 1;

      const advanceOneStep = (date) => {
        if (repeatType === "minute") {
          date.setMinutes(date.getMinutes() + interval);
        } else if (repeatType === "hour") {
          date.setHours(date.getHours() + interval);
        } else if (repeatType === "daily") {
          date.setDate(date.getDate() + 1);
        } else if (repeatType === "weekly") {
          const daysToTry = repeatDays.length > 0 ? repeatDays : [start.getDay()];
          let found = false;
          for (let i = 1; i <= 366; i++) {
            date.setDate(date.getDate() + 1);
            if (daysToTry.includes(date.getDay())) {
              found = true;
              break;
            }
          }
          if (!found) date.setDate(date.getDate() + 1);
        } else if (repeatType === "monthly_lastday") {
          const y = date.getFullYear();
          const m = date.getMonth();
          date.setFullYear(y, m + 2, 0);
        } else if (repeatType === "monthly_day") {
          const targetDay = start.getDate();
          const y = date.getFullYear();
          const m = date.getMonth();
          const nextMax = new Date(y, m + 2, 0).getDate();
          date.setFullYear(y, m + 1, Math.min(targetDay, nextMax));
        }

        if (repeatType !== "minute" && repeatType !== "hour") {
          date.setHours(originalHours, originalMinutes, 0, 0);
        } else {
          date.setSeconds(0, 0);
        }
      };

      if (candidate <= referenceTime) {
        if (repeatType === "minute") {
          const diffMins = Math.floor((referenceTime.getTime() - candidate.getTime()) / 60000);
          const steps = Math.floor(diffMins / interval);
          if (steps > 0) candidate.setMinutes(candidate.getMinutes() + (steps * interval));
        } else if (repeatType === "hour") {
          const diffHours = Math.floor((referenceTime.getTime() - candidate.getTime()) / 3600000);
          const steps = Math.floor(diffHours / interval);
          if (steps > 0) candidate.setHours(candidate.getHours() + (steps * interval));
        }
      }

      let attempts = 0;
      while (candidate <= referenceTime && attempts < 400) {
        advanceOneStep(candidate);
        attempts++;
      }

      return toLocalISOString(candidate);
    }

    function getRepeatLabel(repeatType, repeatDays = [], originalTime, repeatInterval) {
      if (!repeatType || repeatType === "none") return "반복 없음";
      if (repeatType === "minute") return (repeatInterval && repeatInterval > 1) ? (repeatInterval + "분마다 반복") : "매 분 반복";
      if (repeatType === "hour") return (repeatInterval && repeatInterval > 1) ? (repeatInterval + "시간마다 반복") : "매 시간 반복";
      if (repeatType === "daily") return "매일 반복";
      if (repeatType === "monthly_lastday") return "매월 말일 반복";
      if (repeatType === "monthly_day") {
        if (originalTime) {
          const d = new Date(originalTime);
          if (!isNaN(d.getTime())) return "매월 " + d.getDate() + "일 반복";
        }
        return "매월 지정일 반복";
      }
      if (repeatType === "weekly") {
        const labels = ["일", "월", "화", "수", "목", "금", "토"];
        if (!repeatDays || repeatDays.length === 0) return "매주 반복";
        if (repeatDays.length === 7) return "매일 반복";
        const dayNames = [...repeatDays].sort((a, b) => a - b).map(d => labels[d]).join(", ");
        return "매주 [" + dayNames + "] 반복";
      }
      return "반복 설정됨";
    }

    const CATEGORIES = [
      { id: "All", name: "전체", icon: "✨" },
      { id: "Work", name: "업무", icon: "💼", color: "indigo" },
      { id: "Personal", name: "개인", icon: "👤", color: "emerald" },
      { id: "Shopping", name: "쇼핑", icon: "🛒", color: "amber" },
      { id: "Creative", name: "크리에이티브", icon: "🎨", color: "violet" },
      { id: "Health", name: "건강", icon: "🌿", color: "rose" }
    ];

    const PRIORITIES = [
      { id: "high", name: "높음", color: "text-rose-600 bg-rose-50 border-rose-200" },
      { id: "medium", name: "보통", color: "text-amber-600 bg-amber-50 border-amber-200" },
      { id: "low", name: "낮음", color: "text-emerald-600 bg-emerald-50 border-emerald-200" }
    ];

    const REPEAT_TYPES = [
      { id: "none", label: "안 함" },
      { id: "minute", label: "분" },
      { id: "hour", label: "시간" },
      { id: "daily", label: "매일" },
      { id: "weekly", label: "요일" },
      { id: "monthly_lastday", label: "매월 말일" },
      { id: "monthly_day", label: "매월 지정일" }
    ];

    const SOUND_TYPES = [
      { id: "zen_bell", label: "젠벨 🔔" },
      { id: "digital_beep", label: "디지털 🤖" },
      { id: "morning_harp", label: "하프 🎵" },
      { id: "cosmic_synth", label: "코스믹 🌌" }
    ];

    // ==========================================
    // 1. Calendar View Component (월/주별 캘린더 매트릭스)
    // ==========================================
    function CalendarView({ todos, onToggleTodo, onEditClick, onDeleteTodo, onAddTodoForDate, onSwitchToList }) {
      const [calMode, setCalMode] = useState("month"); // "month" | "week"
      const [pivotDate, setPivotDate] = useState(() => new Date());
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split("T")[0]);

      // Month grid builder
      const monthDays = useMemo(() => {
        const y = pivotDate.getFullYear();
        const m = pivotDate.getMonth();
        const firstDay = new Date(y, m, 1);
        const startOffset = firstDay.getDay(); // 0 = Sun
        const lastDay = new Date(y, m + 1, 0);
        const totalDays = lastDay.getDate();

        const list = [];
        for (let i = 0; i < startOffset; i++) list.push(null);
        for (let d = 1; d <= totalDays; d++) list.push(new Date(y, m, d));
        while (list.length % 7 !== 0) list.push(null);
        return list;
      }, [pivotDate]);

      // Week days builder
      const weekDays = useMemo(() => {
        const currDay = pivotDate.getDay();
        const start = new Date(pivotDate);
        start.setDate(pivotDate.getDate() - currDay);
        const list = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          list.push(d);
        }
        return list;
      }, [pivotDate]);

      const handlePrev = () => {
        const next = new Date(pivotDate);
        if (calMode === "month") next.setMonth(pivotDate.getMonth() - 1);
        else next.setDate(pivotDate.getDate() - 7);
        setPivotDate(next);
      };

      const handleNext = () => {
        const next = new Date(pivotDate);
        if (calMode === "month") next.setMonth(pivotDate.getMonth() + 1);
        else next.setDate(pivotDate.getDate() + 7);
        setPivotDate(next);
      };

      const handleToday = () => {
        const t = new Date();
        setPivotDate(t);
        setSelectedDate(t.toISOString().split("T")[0]);
      };

      const formatDateStr = (d) => {
        const pad = (n) => (n < 10 ? "0" : "") + n;
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      };

      const getTodosForDate = (dateStr) => {
        return todos.filter(t => t.dueDate === dateStr);
      };

      const selectedDateTodos = useMemo(() => {
        return getTodosForDate(selectedDate);
      }, [todos, selectedDate]);

      const headerTitle = calMode === "month" 
        ? `${pivotDate.getFullYear()}년 ${pivotDate.getMonth() + 1}월`
        : `${weekDays[0].getFullYear()}년 ${weekDays[0].getMonth() + 1}월 ${weekDays[0].getDate()}일 ~ ${weekDays[6].getMonth() + 1}월 ${weekDays[6].getDate()}일`;

      const todayStr = new Date().toISOString().split("T")[0];

      return (
        <div className="space-y-6">
          {/* Calendar Top Navigation */}
          <div className="glass-card rounded-3xl p-5 shadow-lg border border-white/80">
            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <h3 className="text-xl font-black text-slate-850 tracking-tight flex items-center gap-2">
                  <span>📅</span> {headerTitle}
                </h3>
                <button 
                  onClick={handleToday}
                  className="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition-colors cursor-pointer"
                >
                  오늘
                </button>
              </div>

              <div className="flex items-center gap-2">
                <div className="flex bg-slate-100 p-1 rounded-xl">
                  <button 
                    onClick={() => setCalMode("month")}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${calMode === "month" ? "bg-white text-emerald-700 shadow-xs" : "text-slate-500 hover:text-slate-800"}`}
                  >
                    월간 매트릭스
                  </button>
                  <button 
                    onClick={() => setCalMode("week")}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${calMode === "week" ? "bg-white text-emerald-700 shadow-xs" : "text-slate-500 hover:text-slate-800"}`}
                  >
                    주간 뷰
                  </button>
                </div>

                {onSwitchToList && (
                  <button 
                    onClick={onSwitchToList}
                    className="px-3 py-1.5 rounded-xl text-xs font-black bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-sm hover:from-emerald-500 hover:to-teal-500 transition-all cursor-pointer flex items-center gap-1"
                  >
                    <span>📋</span>
                    <span>목록으로 보기</span>
                  </button>
                )}

                <div className="flex gap-1">
                  <button onClick={handlePrev} className="h-8 w-8 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-700 cursor-pointer shadow-xs">‹</button>
                  <button onClick={handleNext} className="h-8 w-8 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-700 cursor-pointer shadow-xs">›</button>
                </div>
              </div>
            </div>

            {/* Weekday Labels */}
            <div className="grid grid-cols-7 gap-1 text-center mt-4 border-b border-slate-200/80 pb-2">
              {["일", "월", "화", "수", "목", "금", "토"].map((w, idx) => (
                <div key={w} className={`text-xs font-black ${idx === 0 ? "text-rose-500" : idx === 6 ? "text-blue-500" : "text-slate-600"}`}>
                  {w}
                </div>
              ))}
            </div>

            {/* Calendar Grid */}
            {calMode === "month" ? (
              <div className="grid grid-cols-7 gap-1 mt-2">
                {monthDays.map((d, index) => {
                  if (!d) return <div key={"empty-" + index} className="min-h-[70px] sm:min-h-[85px] bg-slate-50/40 rounded-xl border border-transparent" />;
                  const dateStr = formatDateStr(d);
                  const isSelected = selectedDate === dateStr;
                  const isToday = todayStr === dateStr;
                  const dayTodos = getTodosForDate(dateStr);
                  const activeCount = dayTodos.filter(t => !t.completed).length;

                  return (
                    <div 
                      key={dateStr}
                      onClick={() => setSelectedDate(dateStr)}
                      className={`min-h-[70px] sm:min-h-[85px] p-1.5 sm:p-2 rounded-xl border transition-all cursor-pointer flex flex-col justify-between ${isSelected ? "bg-emerald-50 border-emerald-500 ring-2 ring-emerald-200 shadow-sm" : isToday ? "bg-teal-50/60 border-teal-300" : "bg-white/80 border-slate-150 hover:bg-white hover:border-emerald-200"}`}
                    >
                      <div className="flex items-center justify-between">
                        <span className={`text-xs font-extrabold ${isToday ? "h-5 w-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px]" : d.getDay() === 0 ? "text-rose-500" : d.getDay() === 6 ? "text-blue-500" : "text-slate-700"}`}>
                          {d.getDate()}
                        </span>
                        {dayTodos.length > 0 && (
                          <span className={`text-[9px] font-black px-1.5 py-0.2 rounded-full ${activeCount > 0 ? "bg-emerald-500 text-white" : "bg-slate-200 text-slate-600"}`}>
                            {dayTodos.length}
                          </span>
                        )}
                      </div>

                      {/* Mini Todo Indicators */}
                      <div className="space-y-0.5 mt-1 overflow-hidden max-h-10">
                        {dayTodos.slice(0, 2).map(t => (
                          <div key={t.id} className={`text-[9px] truncate px-1 rounded font-medium ${t.completed ? "line-through text-slate-400 bg-slate-100" : "text-emerald-900 bg-emerald-100/70"}`}>
                            {t.title}
                          </div>
                        ))}
                        {dayTodos.length > 2 && (
                          <div className="text-[8px] text-slate-400 font-bold text-right">+{dayTodos.length - 2}개</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              /* Week View */
              <div className="grid grid-cols-7 gap-1.5 mt-2">
                {weekDays.map(d => {
                  const dateStr = formatDateStr(d);
                  const isSelected = selectedDate === dateStr;
                  const isToday = todayStr === dateStr;
                  const dayTodos = getTodosForDate(dateStr);

                  return (
                    <div 
                      key={dateStr}
                      onClick={() => setSelectedDate(dateStr)}
                      className={`min-h-[140px] p-2 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between ${isSelected ? "bg-emerald-50 border-emerald-500 ring-2 ring-emerald-200 shadow-sm" : isToday ? "bg-teal-50/60 border-teal-300" : "bg-white/80 border-slate-150 hover:bg-white"}`}
                    >
                      <div className="flex items-center justify-between border-b border-slate-100 pb-1">
                        <span className={`text-xs font-black ${isToday ? "px-1.5 py-0.5 rounded-full bg-emerald-600 text-white text-[10px]" : "text-slate-700"}`}>
                          {d.getDate()}일
                        </span>
                        <span className="text-[9px] font-bold text-slate-400">{dayTodos.length}건</span>
                      </div>
                      <div className="space-y-1 mt-1 flex-1 overflow-y-auto max-h-28 custom-scrollbar">
                        {dayTodos.map(t => (
                          <div key={t.id} className={`text-[10px] p-1 rounded-lg border leading-tight ${t.completed ? "bg-slate-50 text-slate-400 line-through border-slate-200" : "bg-white text-slate-800 border-emerald-200 shadow-xs"}`}>
                            {t.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Selected Date Todo Details Panel */}
          <div className="glass-card rounded-3xl p-6 shadow-lg border border-white/80 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-150 pb-3">
              <div>
                <h4 className="text-base font-extrabold text-slate-850 flex items-center gap-2">
                  <span>📌</span> {selectedDate} 날짜의 일정 목록 ({selectedDateTodos.length}건)
                </h4>
                <p className="text-xs text-slate-500 mt-0.5">달력에서 선택한 날짜에 등록된 계획 및 목표입니다.</p>
              </div>
              <button

    // ==========================================

    function App() {

      const [isAlarmModalOpen, setIsAlarmModalOpen] = useState(false);
      const [tempAlarmDate, setTempAlarmDate] = useState("");
      const [tempAlarmAmpm, setTempAlarmAmpm] = useState("AM");
      const [tempAlarmHour, setTempAlarmHour] = useState(9);
      const [tempAlarmMinute, setTempAlarmMinute] = useState(0);
      const [alarmRepeat, setAlarmRepeat] = useState("none");
      const [alarmRepeatDays, setAlarmRepeatDays] = useState([]);
      const [alarmRepeatInterval, setAlarmRepeatInterval] = useState(30);
      const [alarmSound, setAlarmSound] = useState("zen_bell");
      const [subtasks, setSubtasks] = useState([]);
      const [newSubtaskText, setNewSubtaskText] = useState("");

      // Edit Modal State
      const [editingTodo, setEditingTodo] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editDescription, setEditDescription] = useState("");
      const [editCategory, setEditCategory] = useState("Work");
      const [editPriority, setEditPriority] = useState("medium");
      const [editDueDate, setEditDueDate] = useState("");
      const [editAlarmTime, setEditAlarmTime] = useState("");
      const [isEditAlarmModalOpen, setIsEditAlarmModalOpen] = useState(false);
      const [editTempAlarmDate, setEditTempAlarmDate] = useState("");
      const [editTempAlarmAmpm, setEditTempAlarmAmpm] = useState("AM");
      const [editTempAlarmHour, setEditTempAlarmHour] = useState(9);
      const [editTempAlarmMinute, setEditTempAlarmMinute] = useState(0);
      const [editAlarmRepeat, setEditAlarmRepeat] = useState("none");
      const [editAlarmRepeatDays, setEditAlarmRepeatDays] = useState([]);
      const [editAlarmRepeatInterval, setEditAlarmRepeatInterval] = useState(30);
      const [editAlarmSound, setEditAlarmSound] = useState("zen_bell");
      const [editSubtasks, setEditSubtasks] = useState([]);
      const [editNewSubtaskText, setEditNewSubtaskText] = useState("");

      // Active Ringing Alarm State
      const [activeAlarmTodo, setActiveAlarmTodo] = useState(null);
      const [audioStopper, setAudioStopper] = useState(null);
      const [toast, setToast] = useState(null);

      // Download Center Modal & Device View Mode
      const [isDownloadModalOpen, setIsDownloadModalOpen] = useState(false);
      const [deviceViewMode, setDeviceViewMode] = useState("pc");

      // 🌿 Mind Healing Journal & AI Diagnosis States
      const [healingTab, setHealingTab] = useState("journal");
      const [journalEntries, setJournalEntries] = useState(() => {
        try {
          const saved = localStorage.getItem("3d_glass_planner_journal_entries");
          return saved ? JSON.parse(saved) : [
            {
              id: "initial-journal-1",
              date: new Date().toISOString().split("T")[0],
              mood: "calm",
              gratitude: "오늘 하루도 차근차근 계획대로 소화할 수 있어 감사한 마음입니다.",
              content: "마음이 조급할 때는 잠시 숨을 고르고 가장 중요한 일부터 하나씩 해결해 나가려고 합니다. 나만의 속도로 성장하는 중!",
              createdAt: new Date().toISOString()
            }
          ];
        } catch (e) {
          return [];
        }
      });
      const [currentMood, setCurrentMood] = useState("calm");
      const [gratitudeText, setGratitudeText] = useState("");
      const [journalContent, setJournalContent] = useState("");
      const [isAddingJournal, setIsAddingJournal] = useState(false);
      const [showConfigGuide, setShowConfigGuide] = useState(false);

      const [isDiagnosing, setIsDiagnosing] = useState(false);
      const [diagnosisResult, setDiagnosisResult] = useState(null);

      const saveJournals = (newEntries) => {
        setJournalEntries(newEntries);
        try {
          localStorage.setItem("3d_glass_planner_journal_entries", JSON.stringify(newEntries));
        } catch (e) {}
      };

      // Save Todos
      const saveTodos = (newTodos) => {
        setTodos(newTodos);
        try {
          localStorage.setItem("3d_glass_todos", JSON.stringify(newTodos));
        } catch (e) {}
      };

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Realtime Alarm Check Loop
      useEffect(() => {
        const interval = setInterval(() => {
          if (activeAlarmTodo) return;
          const now = new Date();
          const currentISO = toLocalISOString(now);

          const triggered = todos.find(t => {
            if (t.completed || !t.alarmTime || t.alarmDismissed) return false;
            return t.alarmTime <= currentISO;
          });

          if (triggered) {
            setActiveAlarmTodo(triggered);
            const stop = playAlarmSound(triggered.alarmSound || "zen_bell");
            setAudioStopper(() => stop);

            if ("Notification" in window && Notification.permission === "granted") {
              try {
                new Notification("⏰ [" + triggered.title + "] 알람 시각 도달", {
                  body: triggered.description || "등록된 일정 알람 시각입니다.",
                  icon: "./icon.png"
                });
              } catch (e) {}
            }
          }
        }, 4000);
        return () => clearInterval(interval);
      }, [todos, activeAlarmTodo]);

      // Request notification on mount
      useEffect(() => {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }, []);

      // Alarm Dismiss / Snooze
      const handleDismissAlarm = (todoId) => {
        if (audioStopper) {
          audioStopper();
          setAudioStopper(null);
        }
        setActiveAlarmTodo(null);

        const updated = todos.map(t => {
          if (t.id === todoId) {
            if (t.alarmRepeat && t.alarmRepeat !== "none") {
              const nextTime = getNextAlarmTime(t.alarmTime, t.alarmRepeat, t.alarmRepeatDays, new Date(), t.alarmRepeatInterval);
              if (nextTime) {
                return { ...t, alarmTime: nextTime, alarmDismissed: false };
              }
            }
            return { ...t, alarmDismissed: true };
          }
          return t;
        });
        saveTodos(updated);
        showToast("알람을 확인 완료 처리했습니다.");
      };

      const handleSnoozeAlarm = (todoId) => {
        if (audioStopper) {
          audioStopper();
          setAudioStopper(null);
        }
        setActiveAlarmTodo(null);

        const snoozeTime = toLocalISOString(new Date(Date.now() + 5 * 60000));
        const updated = todos.map(t => {
          if (t.id === todoId) {
            return { ...t, alarmTime: snoozeTime, alarmDismissed: false };
          }
          return t;
        });
        saveTodos(updated);
        showToast("알람을 5분 뒤로 연기했습니다 (스누즈).", "info");
      };

      // Add Subtask Handlers
      const handleAddSubtask = (e) => {
        e.preventDefault();
        if (!newSubtaskText.trim()) return;
        setSubtasks([...subtasks, { id: Math.random().toString(36).substr(2, 9), text: newSubtaskText.trim(), completed: false }]);
        setNewSubtaskText("");
      };

      const handleAddEditSubtask = (e) => {
        e.preventDefault();
        if (!editNewSubtaskText.trim()) return;
        setEditSubtasks([...editSubtasks, { id: Math.random().toString(36).substr(2, 9), text: editNewSubtaskText.trim(), completed: false }]);
        setEditNewSubtaskText("");
      };

      // Confirm Alarm Time Selection
      const confirmAlarmTime = () => {
        const finalDate = tempAlarmDate || dueDate || new Date().toISOString().split("T")[0];
        let h24 = tempAlarmHour;
        if (tempAlarmAmpm === "PM" && tempAlarmHour < 12) h24 += 12;
        if (tempAlarmAmpm === "AM" && tempAlarmHour === 12) h24 = 0;
        const timeStr = h24.toString().padStart(2, "0") + ":" + tempAlarmMinute.toString().padStart(2, "0");
        setAlarmTime(finalDate + "T" + timeStr);
        setIsAlarmModalOpen(false);
      };

      const confirmEditAlarmTime = () => {
        const finalDate = editTempAlarmDate || editDueDate || new Date().toISOString().split("T")[0];
        let h24 = editTempAlarmHour;
        if (editTempAlarmAmpm === "PM" && editTempAlarmHour < 12) h24 += 12;
        if (editTempAlarmAmpm === "AM" && editTempAlarmHour === 12) h24 = 0;
        const timeStr = h24.toString().padStart(2, "0") + ":" + editTempAlarmMinute.toString().padStart(2, "0");
        setEditAlarmTime(finalDate + "T" + timeStr);
        setIsEditAlarmModalOpen(false);
      };

      // Open Edit Modal
      const handleOpenEdit = (todo) => {
        setEditingTodo(todo);
        setEditTitle(todo.title);
        setEditDescription(todo.description || "");
        setEditCategory(todo.category);
        setEditPriority(todo.priority);
        setEditDueDate(todo.dueDate || "");
        setEditAlarmTime(todo.alarmTime || "");
        setEditAlarmRepeat(todo.alarmRepeat || "none");
        setEditAlarmRepeatDays(todo.alarmRepeatDays || []);
        setEditAlarmRepeatInterval(todo.alarmRepeatInterval || 30);
        setEditAlarmSound(todo.alarmSound || "zen_bell");
        setEditSubtasks(todo.subtasks || []);

        if (todo.alarmTime) {
          const parts = todo.alarmTime.split("T");
          setEditTempAlarmDate(parts[0] || "");
          if (parts[1]) {
            const timeSub = parts[1].split(":");
            const h = parseInt(timeSub[0], 10);
            const m = parseInt(timeSub[1], 10);
            setEditTempAlarmAmpm(h >= 12 ? "PM" : "AM");
            setEditTempAlarmHour(h % 12 === 0 ? 12 : h % 12);
            setEditTempAlarmMinute(m || 0);
          }
        }
      };

      // Submit Create Todo
      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const newTodo = {
          id: Math.random().toString(36).substr(2, 9),
          title: title.trim(),
          description: description.trim() || undefined,
          completed: false,
          category,
          priority,
          dueDate: dueDate || undefined,
          subtasks,
          alarmTime: alarmTime || undefined,
          alarmRepeat: alarmTime ? alarmRepeat : "none",
          alarmRepeatDays: alarmTime && alarmRepeat === "weekly" ? alarmRepeatDays : undefined,
          alarmRepeatInterval: alarmTime && (alarmRepeat === "minute" || alarmRepeat === "hour") ? alarmRepeatInterval : undefined,
          alarmSound: alarmTime ? alarmSound : undefined,
          createdAt: new Date().toISOString()
        };

        saveTodos([newTodo, ...todos]);
        setTitle("");
        setDescription("");
        setCategory("Work");
        setPriority("medium");
        setDueDate("");
        setAlarmTime("");
        setAlarmRepeat("none");
        setAlarmRepeatDays([]);
        setAlarmRepeatInterval(30);
        setSubtasks([]);
        setIsFormOpen(false);
        showToast("새로운 계획이 성공적으로 등록되었습니다!");
      };

      // Submit Save Edit Todo
      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editTitle.trim() || !editingTodo) return;

        const updated = todos.map(t => {
          if (t.id === editingTodo.id) {
            return {
              ...t,
              title: editTitle.trim(),
              description: editDescription.trim() || undefined,
              category: editCategory,
              priority: editPriority,
              dueDate: editDueDate || undefined,
              subtasks: editSubtasks,
              alarmTime: editAlarmTime || undefined,
              alarmRepeat: editAlarmTime ? editAlarmRepeat : "none",
              alarmRepeatDays: editAlarmTime && editAlarmRepeat === "weekly" ? editAlarmRepeatDays : undefined,
              alarmRepeatInterval: editAlarmTime && (editAlarmRepeat === "minute" || editAlarmRepeat === "hour") ? editAlarmRepeatInterval : undefined,
              alarmSound: editAlarmTime ? editAlarmSound : undefined,
              alarmDismissed: false
            };
          }
          return t;
        });

        saveTodos(updated);
        setEditingTodo(null);
        showToast("계획 세부 설정이 수정되었습니다!");
      };

      // Toggle Complete
      const handleToggleComplete = (id) => {
        const updated = todos.map(t => {
          if (t.id === id) {
            const nextDone = !t.completed;
            if (nextDone && window.confetti) {
              window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            }
            return {
              ...t,
              completed: nextDone,
              completedAt: nextDone ? new Date().toISOString() : undefined,
              subtasks: t.subtasks ? t.subtasks.map(s => ({ ...s, completed: nextDone })) : []
            };
          }
          return t;
        });
        saveTodos(updated);
      };

      const handleDeleteTodo = (id) => {
        const target = todos.find(t => t.id === id);
        if (confirm(`'${target?.title || "선택한 일정"}'을(를) 삭제하시겠습니까?`)) {
          saveTodos(todos.filter(t => t.id !== id));
          showToast("일정을 삭제했습니다.");
        }
      };

      // Quick triggers from other views
      const handleAddTodoForDate = (dateStr) => {
        setDueDate(dateStr);
        setTempAlarmDate(dateStr);
        setIsFormOpen(true);
        window.scrollTo({ top: 150, behavior: "smooth" });
      };

      const handleAddTodoForCategory = (catKey) => {
        setCategory(catKey);
        setIsFormOpen(true);
        window.scrollTo({ top: 150, behavior: "smooth" });
      };

      // 🌿 Journal Handlers
      const handleSaveJournal = (e) => {
        e.preventDefault();
        if (!journalContent.trim() && !gratitudeText.trim()) {
          showToast("감사한 일이나 오늘 하루 일기 내용을 작성해 주세요.", "info");
          return;
        }
        const todayStr = new Date().toISOString().split("T")[0];
        const newEntry = {
          id: "journal-" + Date.now(),
          date: todayStr,
          mood: currentMood,
          gratitude: gratitudeText.trim() || undefined,
          content: journalContent.trim(),
          createdAt: new Date().toISOString()
        };
        const updated = [newEntry, ...journalEntries];
        saveJournals(updated);
        setGratitudeText("");
        setJournalContent("");
        setIsAddingJournal(false);
        showToast("🌿 마음 힐링 저널이 안전하게 저장되었습니다!", "success");
      };

      const handleDeleteJournal = (id) => {
        const updated = journalEntries.filter(entry => entry.id !== id);
        saveJournals(updated);
        showToast("저널 기록이 삭제되었습니다.", "info");
      };

      // ⚡ AI / Local Heuristic Diagnosis Runner
      const handleRunDiagnosis = async () => {
        setIsDiagnosing(true);
        showToast("🤖 AI 모델이 일정 균형 및 생산성을 정밀 진단 중입니다...", "info");

        // Try API if online, otherwise fallback to heuristic
        try {
          const res = await fetch("/api/planner/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ todos })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.analysis) {
              setDiagnosisResult({
                feedback: data.analysis.feedback,
                tips: data.analysis.tips || [],
                suggestions: data.analysis.suggestions || [],
                analyzedAt: new Date().toLocaleTimeString(),
                isOffline: false
              });
              showToast("✨ Gemini AI 정밀 진단 보고서가 도착했습니다!", "success");
              setIsDiagnosing(false);
              return;
            }
          }
        } catch (e) {}

        // Fallback Heuristic
        setTimeout(() => {
          const totalCount = todos.length;
          const completedCount = todos.filter(t => t.completed).length;
          const activeTodos = todos.filter(t => !t.completed);
          const highPriorityCount = activeTodos.filter(t => t.priority === "high").length;
          const completionRate = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

          let feedback = "";
          if (totalCount === 0) {
            feedback = "현재 등록된 일정이 없습니다. 오늘 꼭 이루고 싶은 핵심 목표 1~2가지를 가볍게 추가해 하루를 시작해 보세요!";
          } else if (completionRate >= 70) {
            feedback = `전체 ${totalCount}개 일정 중 ${completedCount}개(${completionRate}%)를 완수하셨습니다! 뛰어난 실행력과 집중력을 발휘하셨으며, 저녁 시간대에는 온전한 휴식을 권장합니다.`;
          } else if (highPriorityCount >= 3) {
            feedback = `긴급/중요도가 높은 일정이 ${highPriorityCount}개 집중되어 있습니다. 오전 시간에 가장 핵심적인 과제 1개를 먼저 완수하고 나머지는 순차적으로 분산하세요.`;
          } else {
            feedback = `총 ${activeTodos.length}개의 진행 중인 일정이 잘 정돈되어 있습니다. 우선순위대로 하나씩 완료 체크해 나가면 안정적인 성취감을 얻을 수 있습니다.`;
          }

          setDiagnosisResult({
            feedback,
            tips: [
              { title: "25분 집중 + 5분 이완 (뽀모도로)", description: "높은 집중력이 필요한 작업은 25분간 몰입한 뒤 5분간 가볍게 스트레칭을 병행하세요." },
              { title: "하루 3대 핵심 과제 (Rule of 3)", description: "오늘 반드시 끝낼 가장 가치 있는 3가지 작업에 먼저 집중하세요." }
            ],
            suggestions: [
              {
                title: "업무 중간 10분 마인드 리셋 & 눈 스트레칭",
                description: "장시간 집중으로 인한 피로를 덜기 위한 가벼운 이완 시간",
                category: "Health",
                priority: "medium",
                dueDateOffset: 0,
                subtasks: ["인공눈물 넣기", "먼 산 바라보며 심호흡 5회"]
              },
              {
                title: "내일 아침을 위한 5분 데스크 정리 & 일정 프리뷰",
                description: "하루를 마감하며 내일 할 일을 3줄로 미리 훑어보는 습관",
                category: "Personal",
                priority: "low",
                dueDateOffset: 1,
                subtasks: ["책상 위 컵 정리", "내일 1순위 할 일 캘린더 확인"]
              }
            ],
            analyzedAt: new Date().toLocaleTimeString(),
            isOffline: true
          });
          showToast("💡 로컬 정밀 진단 분석이 완료되었습니다.", "success");
          setIsDiagnosing(false);
        }, 600);
      };

      const handleAddTodoFromAISuggestion = (sug) => {
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + (sug.dueDateOffset || 0));
        const dueDateStr = targetDate.toISOString().split("T")[0];

        const newTodo = {
          id: "ai-todo-" + Date.now(),
          title: sug.title,
          description: sug.description,
          category: sug.category || "Work",
          priority: sug.priority || "medium",
          dueDate: dueDateStr,
          completed: false,
          createdAt: new Date().toISOString(),
          subtasks: (sug.subtasks || []).map((stText, idx) => ({
            id: `ai-sub-${Date.now()}-${idx}`,
            text: stText,
            completed: false
          }))
        };

        saveTodos([newTodo, ...todos]);
        showToast(`🎯 '${sug.title}' 일정이 플래너에 추가되었습니다!`, "success");
      };

      // Export JSON backup (Todos + Journals)
      const handleExportJSON = () => {
        const backupData = {
          todos,
          journals: journalEntries,
          backupDate: new Date().toISOString(),
          version: "1.0"
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const anchor = document.createElement("a");
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `3d_planner_backup_${new Date().toISOString().split("T")[0]}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        showToast("일정 및 저널 백업 파일(JSON)을 다운로드했습니다.");
      };

      // Import JSON backup
      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              saveTodos(imported);
              showToast(`성공적으로 ${imported.length}개의 일정을 복원했습니다!`);
            } else if (imported && Array.isArray(imported.todos)) {
              saveTodos(imported.todos);
              if (Array.isArray(imported.journals)) {
                saveJournals(imported.journals);
              }
              showToast(`성공적으로 ${imported.todos.length}개의 일정과 저널을 복원했습니다!`);
            } else {
              showToast("유효한 일정 백업 JSON 파일이 아닙니다.", "error");
            }
          } catch (err) {
            showToast("파일을 읽는 도중 오류가 발생했습니다.", "error");
          }
        };
        reader.readAsText(file);
      };

      // Filtered Todos for List View
      const filteredTodos = useMemo(() => {
        return todos.filter(t => {
          const matchCat = selectedCategory === "All" || t.category === selectedCategory;
          const matchSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || (t.description && t.description.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchStatus = statusFilter === "All" || (statusFilter === "Completed" && t.completed) || (statusFilter === "Active" && !t.completed);
          return matchCat && matchSearch && matchStatus;
        }).sort((a, b) => {
          if (sortBy === "dueDate") {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return new Date(a.dueDate) - new Date(b.dueDate);
          }
          if (sortBy === "priority") {
            const pMap = { high: 3, medium: 2, low: 1 };
            return pMap[b.priority] - pMap[a.priority];
          }
          if (sortBy === "latest") {
            return new Date(b.createdAt) - new Date(a.createdAt);
          }
          return 0;
        });
      }, [todos, selectedCategory, searchQuery, statusFilter, sortBy]);

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-8 pb-24">
          
          {/* Top Bar with Icon, Title, Sub-actions (Google Calendar & Dark Mode) and Dev Tools button */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 border-b border-slate-200/80 pb-6">
            <div className="flex items-center gap-3.5">
              <div className="relative h-14 w-14 rounded-2xl overflow-hidden shadow-xl border-2 border-emerald-400/60 flex items-center justify-center bg-emerald-500/10 hover:scale-105 transition-transform duration-300">
                <img src={CUBE_ICON_SRC} alt="3D Glass Cube App Icon" className="w-full h-full object-cover" />
              </div>
              <div>
                <h1 className="text-2xl sm:text-3xl font-black text-slate-850 tracking-tight bg-gradient-to-r from-emerald-600 via-teal-700 to-slate-900 bg-clip-text text-transparent">
                  Master Planner
                </h1>
                <p className="text-xs font-bold text-emerald-700/90 mt-0.5 mb-2">
                  3D Glassmorphic Planner & Repetition Schedule
                </p>

                {/* Sub-header User Controls: Google Calendar Sync & Dark Mode Toggle (투명한 사각형 단추) */}
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    onClick={() => showToastMessage("Google Calendar 동기화는 온라인 환경에서 연동됩니다.", "info")}
                    className="py-1.5 px-3 rounded-none bg-transparent hover:bg-emerald-500/10 dark:hover:bg-white/20 border border-slate-400/90 dark:border-slate-100 text-slate-850 dark:text-slate-50 text-xs font-black flex items-center gap-1.5 transition-colors cursor-pointer active:scale-95 shadow-xs"
                  >
                    <span>📅</span>
                    <span className="text-slate-850 dark:text-slate-50 font-black">google calendar 연동</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const isDark = document.documentElement.classList.toggle("dark");
                      setTheme(isDark ? "dark" : "light");
                      showToastMessage(isDark ? "다크 모드로 전환되었습니다." : "라이트 모드로 전환되었습니다.", "info");
                    }}
                    className="py-1.5 px-3 rounded-none bg-transparent hover:bg-slate-500/10 dark:hover:bg-white/20 border border-slate-400/90 dark:border-slate-100 text-slate-850 dark:text-slate-50 text-xs font-black flex items-center gap-1.5 transition-colors cursor-pointer active:scale-95 shadow-xs"
                  >
                    <span>{theme === "dark" ? "☀️" : "🌙"}</span>
                    <span className="text-slate-850 dark:text-slate-50 font-black">{theme === "dark" ? "라이트모드" : "다크모드"}</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Top Quick Actions (View Mode Switcher, Desktop App Download, Developer Tools & Data Backup) */}
            <div className="flex flex-wrap items-center gap-2">
              {/* View Mode Switcher */}
              <div className="flex items-center gap-1 bg-white/80 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200 dark:border-slate-700 shadow-xs">
                <button
                  type="button"
                  onClick={() => {
                    setDeviceViewMode("pc");
                    showToast("💻 PC 와이드 뷰 화면으로 전환되었습니다.", "info");
                  }}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                    deviceViewMode === "pc"
                      ? "bg-emerald-600 text-white shadow-xs"
                      : "text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700"
                  }`}
                >
                  💻 PC 뷰
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setDeviceViewMode("tablet");
                    showToast("📟 태블릿 뷰 화면으로 전환되었습니다.", "info");
                  }}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                    deviceViewMode === "tablet"
                      ? "bg-emerald-600 text-white shadow-xs"
                      : "text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700"
                  }`}
                >
                  📟 태블릿 뷰
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setDeviceViewMode("mobile");
                    showToast("📱 모바일 뷰 화면으로 전환되었습니다.", "info");
                  }}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                    deviceViewMode === "mobile"
                      ? "bg-emerald-600 text-white shadow-xs"
                      : "text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700"
                  }`}
                >
                  📱 모바일 뷰
                </button>
              </div>

              {/* 바탕화면 앱 다운로드 */}
              <button 
                type="button"
                onClick={() => setIsDownloadModalOpen(true)}
                className="py-2 px-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-650 hover:from-emerald-700 text-white font-extrabold text-xs shadow-md shadow-emerald-500/20 hover:scale-[1.02] transition-all flex items-center gap-1.5 cursor-pointer active:scale-95"
                title="바탕화면 앱 다운로드 및 설치"
              >
                <span>📲 바탕화면 앱 다운로드</span>
              </button>

              <button 
                onClick={handleExportJSON}
                className="py-2 px-3 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-xs shadow-xs transition-all flex items-center gap-1.5 cursor-pointer"
                title="데이터 백업"
              >
                <span>💾 데이터 백업</span>
              </button>
              <label className="py-2 px-3 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-xs shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
                <span>📂 복원</span>
                <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
              </label>
              <button 
                onClick={() => setIsDownloadModalOpen(true)}
                className="py-2 px-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 text-slate-700 dark:text-slate-200 font-extrabold text-xs shadow-xs transition-all flex items-center gap-1.5 cursor-pointer active:scale-95"
              >
                <span>🛠️ 개발자 도구</span>
              </button>
            </div>
          </div>

          {/* Add Task Trigger Button */}
          <div className="flex justify-center mb-6">
            <button 
              onClick={() => setIsFormOpen(!isFormOpen)}
              className="flex items-center gap-2 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold px-6 py-3.5 rounded-2xl shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 hover:-translate-y-0.5 transition-all duration-300 active:translate-y-0 text-sm cursor-pointer"
            >
              <span>{isFormOpen ? "✕ 작성 폼 닫기" : "✨ 새로운 일정 / 목표 추가하기"}</span>
            </button>
          </div>

          {/* Add Todo Form */}
          {isFormOpen && (
            <div className="glass-card rounded-3xl p-6 mb-8 border border-emerald-200/80 shadow-xl">
              <h3 className="text-base font-extrabold text-slate-800 mb-4 flex items-center gap-2">
                <span className="text-emerald-500">📝</span> 새 일정 및 목표 등록
              </h3>
              <form onSubmit={handleAddTodo} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">제목 *</label>
                  <input 
                    type="text" 
                    value={title} 
                    onChange={e => setTitle(e.target.value)} 
                    placeholder="계획이나 할 일을 입력하세요..." 
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none text-sm font-medium bg-white/90"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">메모 / 세부 설명</label>
                  <textarea 
                    value={description} 
                    onChange={e => setDescription(e.target.value)} 
                    placeholder="상세한 준비사항이나 메모를 남겨보세요..." 
                    rows={2}
                    className="w-full px-4 py-2 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none text-xs font-medium bg-white/90"
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">카테고리</label>
                    <select 
                      value={category} 
                      onChange={e => setCategory(e.target.value)} 
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700 outline-none focus:border-emerald-500"
                    >
                      {CATEGORIES.filter(c => c.id !== "All").map(c => (
                        <option key={c.id} value={c.id}>{c.icon} {c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">우선순위</label>
                    <select 
                      value={priority} 
                      onChange={e => setPriority(e.target.value)} 
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700 outline-none focus:border-emerald-500"
                    >
                      {PRIORITIES.map(p => (
                        <option key={p.id} value={p.id}>{p.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">마감일</label>
                    <input 
                      type="date" 
                      value={dueDate} 
                      onChange={e => setDueDate(e.target.value)} 
                      className="w-full px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700 outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                {/* Alarm Setting Button / Summary Box */}
                <div className="p-3.5 rounded-2xl bg-emerald-50/60 border border-emerald-200/80 space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-extrabold text-emerald-950 flex items-center gap-1.5">
                      <span>⏰</span> 알람 설정 (선택)
                    </label>
                    {alarmTime && (
                      <span className="text-[10px] font-black bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full">
                        ✓ 설정 완료
                      </span>
                    )}
                  </div>

                  {alarmTime ? (
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5 p-3 rounded-xl bg-white border border-emerald-300 shadow-xs">
                      <div className="flex items-center gap-2">
                        <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-sm shrink-0">
                          ⏰
                        </div>
                        <div className="text-left">
                          <div className="text-xs font-black text-slate-850 font-mono">
                            {alarmTime.replace("T", " ")}
                          </div>
                          <div className="text-[11px] font-bold text-emerald-700">
                            {getRepeatLabel(alarmRepeat, alarmRepeatDays, alarmTime, alarmRepeatInterval)} · 벨소리: {SOUND_TYPES.find(s => s.id === alarmSound)?.label || "젠 벨"}
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-1.5 self-end sm:self-center">
                        <button 
                          type="button" 
                          onClick={() => {
                            if (alarmTime) {
                              const parts = alarmTime.split("T");
                              setTempAlarmDate(parts[0] || "");
                              if (parts[1]) {
                                const tParts = parts[1].split(":");
                                const h = parseInt(tParts[0], 10) || 9;
                                const m = parseInt(tParts[1], 10) || 0;
                                setTempAlarmAmpm(h >= 12 ? "PM" : "AM");
                                setTempAlarmHour(h % 12 === 0 ? 12 : h % 12);
                                setTempAlarmMinute(m);
                              }
                            }
                            setIsAlarmModalOpen(true);
                          }}
                          className="py-1.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold border border-emerald-300 transition-colors cursor-pointer"
                        >
                          ✏️ 알람 세부 수정
                        </button>
                        <button 
                          type="button" 
                          onClick={() => { setAlarmTime(""); setAlarmRepeat("none"); }}
                          className="py-1.5 px-2.5 rounded-xl bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-700 text-xs font-bold border border-slate-200 transition-colors cursor-pointer"
                        >
                          해제
                        </button>
                      </div>
                    </div>
                  ) : (
                    <button 
                      type="button" 
                      onClick={() => {
                        setTempAlarmDate(dueDate || new Date().toISOString().split("T")[0]);
                        setTempAlarmAmpm("AM");
                        setTempAlarmHour(9);
                        setTempAlarmMinute(0);
                        setIsAlarmModalOpen(true);
                      }}
                      className="w-full py-3 px-4 rounded-xl border-2 border-dashed border-emerald-300/90 bg-white hover:bg-emerald-50 text-emerald-800 text-xs font-extrabold flex items-center justify-center gap-2 transition-all cursor-pointer shadow-xs hover:border-emerald-500"
                    >
                      <span className="text-base">⏰</span>
                      <span>알람 설정 (시간 지정 / 반복 주기 / 벨소리 설정하기)</span>
                    </button>
                  )}
                </div>

                {/* Subtask Checklist Section */}
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">하위 작업 체크리스트</label>
                  <div className="flex gap-2 mb-2">
                    <input 
                      type="text" 
                      value={newSubtaskText} 
                      onChange={e => setNewSubtaskText(e.target.value)} 
                      placeholder="하위 필수 작업을 입력하세요..." 
                      className="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 text-xs outline-none focus:border-emerald-500 bg-white"
                      onKeyDown={e => { if (e.key === "Enter") handleAddSubtask(e); }}
                    />
                    <button

                                    type="button"
                                    onClick={() => {
                                      const baseDate = editAlarmTime ? editAlarmTime.split("T")[0] : (editDueDate || new Date().toISOString().split("T")[0]);
                                      const parts = baseDate.split("-");
                                      const nextDate = parts[0] + "-" + parts[1] + "-" + dayNum.toString().padStart(2, "0");
                                      const timePart = editAlarmTime ? (editAlarmTime.split("T")[1] || "09:00") : "09:00";
                                      setEditAlarmTime(nextDate + "T" + timePart);
                                    }}
                                    className={`h-7 rounded-lg text-[10px] font-bold border cursor-pointer ${isSel ? "bg-emerald-600 text-white border-emerald-600" : "bg-slate-50 text-slate-700 border-slate-200"}`}
                                  >
                                    {dayNum}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        {/* Sound Format in Edit */}
                        <div className="pt-2">
                          <div className="flex items-center justify-between mb-1.5">
                            <span className="text-[10px] font-extrabold text-slate-600 uppercase">🎵 알람 벨소리 형식</span>
                            <span className="text-[9px] text-emerald-600 font-bold">클릭 시 미리듣기</span>
                          </div>
                          <div className="grid grid-cols-4 gap-1.5">
                            {SOUND_TYPES.map(s => (
                              <button
                                key={s.id}
                                type="button"
                                onClick={() => {
                                  setEditAlarmSound(s.id);
                                  const stop = playAlarmSound(s.id);
                                  setTimeout(stop, 1500);
                                }}
                                className={`py-1.5 px-1 rounded-xl text-[10px] font-bold border transition-all cursor-pointer ${editAlarmSound === s.id ? "bg-emerald-600 border-emerald-600 text-white" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"}`}
                              >
                                {s.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Edit Subtasks */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">하위 작업 체크리스트</label>
                    <div className="flex gap-2 mb-2">
                      <input 
                        type="text" 
                        value={editNewSubtaskText} 
                        onChange={e => setEditNewSubtaskText(e.target.value)} 
                        placeholder="하위 필수 작업을 입력하세요..." 
                        className="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 text-xs outline-none focus:border-emerald-500 bg-white"
                        onKeyDown={e => { if (e.key === "Enter") handleAddEditSubtask(e); }}
                      />
                      <button 
                        type="button" 
                        onClick={handleAddEditSubtask}
                        className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer"
                      >
                        + 추가
                      </button>
                    </div>
                    {editSubtasks.map((st, i) => (
                      <div key={st.id} className="flex items-center justify-between py-1 px-2.5 bg-slate-50 rounded-lg border border-slate-150 mb-1 text-xs text-slate-700">
                        <span>{i + 1}. {st.text}</span>
                        <button 
                          type="button" 
                          onClick={() => setEditSubtasks(editSubtasks.filter(s => s.id !== st.id))}
                          className="text-rose-500 font-bold hover:text-rose-700 cursor-pointer"
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* Modal Action Buttons */}
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button 
                      type="button" 
                      onClick={() => setEditingTodo(null)}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold cursor-pointer"
                    >
                      취소
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold shadow-md shadow-emerald-500/20 cursor-pointer"
                    >
                      변경 사항 저장
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Edit Time Picker Modal */}
          {isEditAlarmModalOpen && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm border border-slate-200 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h4 className="text-sm font-extrabold text-slate-850">⏰ 알람 시각 변경</h4>
                  <button onClick={() => setIsEditAlarmModalOpen(false)} className="text-slate-400 hover:text-slate-700 cursor-pointer">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">날짜 선택</label>
                  <input 
                    type="date" 
                    value={editTempAlarmDate || editDueDate || new Date().toISOString().split("T")[0]} 
                    onChange={e => setEditTempAlarmDate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold outline-none focus:border-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">시각 선택</label>
                  <div className="flex gap-2">
                    <select 
                      value={editTempAlarmAmpm} 
                      onChange={e => setEditTempAlarmAmpm(e.target.value)}
                      className="flex-1 px-2 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold cursor-pointer"
                    >
                      <option value="AM">오전 (AM)</option>
                      <option value="PM">오후 (PM)</option>
                    </select>
                    <select 
                      value={editTempAlarmHour} 
                      onChange={e => setEditTempAlarmHour(parseInt(e.target.value, 10))}
                      className="flex-1 px-2 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold cursor-pointer"
                    >
                      {Array.from({ length: 12 }).map((_, i) => (
                        <option key={i + 1} value={i + 1}>{(i + 1).toString().padStart(2, "0")}시</option>
                      ))}
                    </select>
                    <select 
                      value={editTempAlarmMinute} 
                      onChange={e => setEditTempAlarmMinute(parseInt(e.target.value, 10))}
                      className="flex-1 px-2 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold cursor-pointer"
                    >
                      {Array.from({ length: 60 }).map((_, i) => (
                        <option key={i} value={i}>{i.toString().padStart(2, "0")}분</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => { setEditAlarmTime(""); setIsEditAlarmModalOpen(false); }}
                    className="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold cursor-pointer"
                  >
                    초기화
                  </button>
                  <button 
                    onClick={confirmEditAlarmTime}
                    className="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold shadow-md shadow-emerald-500/20 cursor-pointer"
                  >
                    선택 완료
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ACTIVE RINGING ALARM MODAL */}
          {activeAlarmTodo && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-md">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md border-2 border-emerald-400 shadow-2xl text-center space-y-4">
                <div className="h-16 w-16 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl animate-pulse">
                  🔔
                </div>
                <div>
                  <span className="text-[11px] font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full uppercase tracking-wider">
                    {getRepeatLabel(activeAlarmTodo.alarmRepeat, activeAlarmTodo.alarmRepeatDays, activeAlarmTodo.alarmTime, activeAlarmTodo.alarmRepeatInterval)}
                  </span>
                  <h3 className="text-xl font-extrabold text-slate-850 mt-2">{activeAlarmTodo.title}</h3>
                  {activeAlarmTodo.description && (
                    <p className="text-xs text-slate-500 mt-1">{activeAlarmTodo.description}</p>
                  )}
                </div>

                <div className="flex gap-3 pt-2">
                  <button 
                    onClick={() => handleSnoozeAlarm(activeAlarmTodo.id)}
                    className="flex-1 py-3 rounded-2xl border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold transition-colors cursor-pointer"
                  >
                    💤 5분 뒤 다시 알림 (스누즈)
                  </button>
                  <button 
                    onClick={() => handleDismissAlarm(activeAlarmTodo.id)}
                    className="flex-1 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold shadow-lg shadow-emerald-500/25 transition-colors cursor-pointer"
                  >
                    ✓ 확인 완료 (해제)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DOWNLOAD CENTER MODAL */}
          {isDownloadModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md border border-slate-200 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-150 pb-3">
                  <h3 className="text-base font-extrabold text-slate-850 flex items-center gap-2">
                    <span>📦</span> 다운로드 센터 & 배포 가이드
                  </h3>
                  <button onClick={() => setIsDownloadModalOpen(false)} className="text-slate-400 hover:text-slate-700 text-sm cursor-pointer">✕</button>
                </div>

                <p className="text-xs text-slate-600 leading-relaxed">
                  인터넷 연결 없이 로컬에서 평생 사용하거나 GitHub Pages에 바로 배포할 수 있는 완제품 패키지 파일들입니다.
                </p>

                <div className="space-y-2.5">
                  <a 
                    href="/api/download/github-pwa-zip"
                    download="3D_Glass_Planner_Vite_GitHub_Pages_PWA.zip"
                    className="w-full py-2.5 px-3.5 rounded-xl bg-gradient-to-r from-emerald-600 via-teal-600 to-indigo-600 hover:from-emerald-700 hover:to-indigo-700 text-white font-extrabold text-xs shadow-md transition-all flex items-center justify-between no-underline"
                  >
                    <span className="flex items-center gap-2">🚀 Vite PWA + GitHub Pages 자동 배포 패키지 (.ZIP)</span>
                    <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-md">추천 완제품</span>
                  </a>

                  <a 
                    href="/api/download/standalone-html"
                    download="3D_Glass_Planner_Standalone.html"
                    className="w-full py-2.5 px-3.5 rounded-xl border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 font-extrabold text-xs shadow-xs transition-all flex items-center justify-between no-underline"
                  >
                    <span className="flex items-center gap-2">⚡ 단독 실행 HTML 파일 (.HTML)</span>
                    <span className="text-[10px] text-emerald-700 bg-white px-2 py-0.5 rounded-md border border-emerald-200">무설치</span>
                  </a>

                  <a 
                    href="/api/download/source-code-zip"
                    download="3D_Planner_Source_Code.zip"
                    className="w-full py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-xs shadow-xs transition-all flex items-center justify-between no-underline"
                  >
                    <span className="flex items-center gap-2">📁 전체 소스코드 패키지 (.ZIP)</span>
                    <span className="text-[10px] bg-slate-700 px-2 py-0.5 rounded-md">TypeScript</span>
                  </a>

                  <a 
                    href="/api/download/modified-files-zip"
                    download="3D_Planner_Modified_Files.zip"
                    className="w-full py-2.5 px-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs shadow-xs transition-all flex items-center justify-between no-underline"
                  >
                    <span className="flex items-center gap-2">✨ 변경된 핵심 파일 모음 (.ZIP)</span>
                    <span className="text-[10px] bg-indigo-500 px-2 py-0.5 rounded-md">수정본</span>
                  </a>

                  <a 
                    href="/api/download-icons-zip"
                    download="3D_Planner_Icons_Pack.zip"
                    className="w-full py-2.5 px-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-extrabold text-xs shadow-xs transition-all flex items-center justify-between no-underline"
                  >
                    <span className="flex items-center gap-2">🎨 3D 아이콘 전체 팩 (.ZIP)</span>
                    <span className="text-[10px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">PNG 512/192</span>
                  </a>
                </div>

                <div className="pt-2 text-right">
                  <button 
                    onClick={() => setIsDownloadModalOpen(false)}
                    className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2">
              <span>{toast.type === "error" ? "⚠️" : "✨"}</span>
              <span>{toast.msg}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
