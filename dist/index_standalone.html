    // --- Web Audio API 알람 사운드 엔진 ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    function playAlarmSound(soundType = "zen_bell") {
      try {
        const ctx = getAudioContext();
        if (ctx.state === "suspended") ctx.resume();

        let isStopped = false;
        const activeNodes = [];

        const playTone = (freq, startTime, duration, type = "sine", volume = 0.25, filterFreq = 0) => {
          if (isStopped) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          let lastNode = osc;

          if (filterFreq > 0) {
            const filter = ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(filterFreq, startTime);
            osc.connect(filter);
            lastNode = filter;
            activeNodes.push(filter);
          }

          lastNode.connect(gain);
          gain.connect(ctx.destination);

          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + Math.min(0.08, duration * 0.15));
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.start(startTime);
          osc.stop(startTime + duration);
          activeNodes.push(osc, gain);
        };

        const triggerSequence = () => {
          const now = ctx.currentTime;
          switch (soundType) {
            case "digital_beep":
              playTone(880, now, 0.1, "square", 0.12);
              playTone(880, now + 0.15, 0.1, "square", 0.12);
              playTone(880, now + 0.7, 0.1, "square", 0.12);
              playTone(880, now + 0.85, 0.1, "square", 0.12);
              break;
            case "morning_harp":
              playTone(261.63, now, 0.8, "triangle", 0.18);
              playTone(293.66, now + 0.12, 0.8, "triangle", 0.18);
              playTone(329.63, now + 0.24, 0.8, "triangle", 0.18);
              playTone(392.00, now + 0.36, 1.2, "triangle", 0.18);
              playTone(440.00, now + 0.48, 1.2, "triangle", 0.18);
              playTone(523.25, now + 0.60, 1.5, "triangle", 0.18);
              break;
            case "cosmic_synth":
              playTone(220.00, now, 2.5, "sawtooth", 0.15, 600);
              playTone(277.18, now + 0.1, 2.5, "sawtooth", 0.12, 600);
              playTone(329.63, now + 0.2, 2.5, "sawtooth", 0.12, 600);
              playTone(493.88, now + 0.3, 2.5, "sawtooth", 0.10, 600);
              break;
            case "zen_bell":
            default:
              playTone(329.63, now, 1.5, "sine", 0.22);
              playTone(392.00, now + 0.2, 1.5, "sine", 0.22);
              playTone(523.25, now + 0.4, 2.0, "sine", 0.22);
              playTone(659.25, now + 0.6, 2.5, "sine", 0.22);
              break;
          }
        };

        triggerSequence();
        const loopDuration = soundType === "digital_beep" ? 2000 : 3500;
        const intervalId = setInterval(() => {
          if (isStopped) return;
          triggerSequence();
        }, loopDuration);

        return () => {
          isStopped = true;
          clearInterval(intervalId);
          activeNodes.forEach(n => {
            try { n.disconnect(); } catch (e) {}
          });
        };
      } catch (e) {
        console.warn("Audio error:", e);
        return () => {};
      }
    }

    // --- 반복 알람 다음 시각 계산 유틸리티 ---
    function toLocalISOString(date) {
      const pad = (num) => (num < 10 ? "0" : "") + num;
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function getNextAlarmTime(originalAlarmTime, repeatType, repeatDays = [], referenceTime = new Date(), repeatInterval = 30) {
      if (!originalAlarmTime || repeatType === "none" || !repeatType) return null;
      const start = new Date(originalAlarmTime);
      if (isNaN(start.getTime())) return null;

      const originalHours = start.getHours();
      const originalMinutes = start.getMinutes();
      let candidate = new Date(start.getTime());

      if (repeatType !== "minute" && repeatType !== "hour") {
        candidate.setHours(originalHours, originalMinutes, 0, 0);
      } else {
        candidate.setSeconds(0, 0);
      }

      const interval = repeatInterval && repeatInterval > 0 ? repeatInterval : 1;

      const advanceOneStep = (date) => {
        if (repeatType === "minute") {
          date.setMinutes(date.getMinutes() + interval);
        } else if (repeatType === "hour") {
          date.setHours(date.getHours() + interval);
        } else if (repeatType === "daily") {
          date.setDate(date.getDate() + 1);
        } else if (repeatType === "weekly") {
          const daysToTry = repeatDays.length > 0 ? repeatDays : [start.getDay()];
          let found = false;
          for (let i = 1; i <= 366; i++) {
            date.setDate(date.getDate() + 1);
            if (daysToTry.includes(date.getDay())) {
              found = true;
              break;
            }
          }
          if (!found) date.setDate(date.getDate() + 1);
        } else if (repeatType === "monthly_lastday") {
          const y = date.getFullYear();
          const m = date.getMonth();
          date.setFullYear(y, m + 2, 0);
        } else if (repeatType === "monthly_day") {
          const targetDay = start.getDate();
          const y = date.getFullYear();
          const m = date.getMonth();
          const nextMax = new Date(y, m + 2, 0).getDate();
          date.setFullYear(y, m + 1, Math.min(targetDay, nextMax));
        }

        if (repeatType !== "minute" && repeatType !== "hour") {
          date.setHours(originalHours, originalMinutes, 0, 0);
        } else {
          date.setSeconds(0, 0);
        }
      };

      if (candidate <= referenceTime) {
        if (repeatType === "minute") {
          const diffMins = Math.floor((referenceTime.getTime() - candidate.getTime()) / 60000);
          const steps = Math.floor(diffMins / interval);
          if (steps > 0) candidate.setMinutes(candidate.getMinutes() + (steps * interval));
        } else if (repeatType === "hour") {
          const diffHours = Math.floor((referenceTime.getTime() - candidate.getTime()) / 3600000);
          const steps = Math.floor(diffHours / interval);
          if (steps > 0) candidate.setHours(candidate.getHours() + (steps * interval));
        }
      }

      let attempts = 0;
      while (candidate <= referenceTime && attempts < 400) {
        advanceOneStep(candidate);
        attempts++;
      }

      return toLocalISOString(candidate);
    }

    function getRepeatLabel(repeatType, repeatDays = [], originalTime, repeatInterval) {
      if (!repeatType || repeatType === "none") return "반복 없음";
      if (repeatType === "minute") return (repeatInterval && repeatInterval > 1) ? (repeatInterval + "분마다 반복") : "매 분 반복";
      if (repeatType === "hour") return (repeatInterval && repeatInterval > 1) ? (repeatInterval + "시간마다 반복") : "매 시간 반복";
      if (repeatType === "daily") return "매일 반복";
      if (repeatType === "monthly_lastday") return "매월 말일 반복";
      if (repeatType === "monthly_day") {
        if (originalTime) {
          const d = new Date(originalTime);
          if (!isNaN(d.getTime())) return "매월 " + d.getDate() + "일 반복";
        }
        return "매월 지정일 반복";
      }
      if (repeatType === "weekly") {
        const labels = ["일", "월", "화", "수", "목", "금", "토"];
        if (!repeatDays || repeatDays.length === 0) return "매주 반복";
        if (repeatDays.length === 7) return "매일 반복";
        const dayNames = [...repeatDays].sort((a, b) => a - b).map(d => labels[d]).join(", ");
        return "매주 [" + dayNames + "] 반복";
      }
      return "반복 설정됨";
    }

    function CalendarView({ todos, onToggleTodo, onEditClick, onDeleteTodo, onAddTodoForDate, onSwitchToList }) {
      const [calMode, setCalMode] = useState("month"); // "month" | "week"
      const [pivotDate, setPivotDate] = useState(() => new Date());
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split("T")[0]);

      // Month grid builder
      const monthDays = useMemo(() => {
        const y = pivotDate.getFullYear();
        const m = pivotDate.getMonth();
        const firstDay = new Date(y, m, 1);
        const startOffset = firstDay.getDay(); // 0 = Sun
        const lastDay = new Date(y, m + 1, 0);
        const totalDays = lastDay.getDate();

        const list = [];
        for (let i = 0; i < startOffset; i++) list.push(null);
        for (let d = 1; d <= totalDays; d++) list.push(new Date(y, m, d));
        while (list.length % 7 !== 0) list.push(null);
        return list;
      }, [pivotDate]);

      // Week days builder
      const weekDays = useMemo(() => {
        const currDay = pivotDate.getDay();
        const start = new Date(pivotDate);
        start.setDate(pivotDate.getDate() - currDay);
        const list = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          list.push(d);
        }
        return list;
      }, [pivotDate]);

      const handlePrev = () => {
        const next = new Date(pivotDate);
        if (calMode === "month") next.setMonth(pivotDate.getMonth() - 1);
        else next.setDate(pivotDate.getDate() - 7);
        setPivotDate(next);
      };

      const handleNext = () => {
        const next = new Date(pivotDate);
        if (calMode === "month") next.setMonth(pivotDate.getMonth() + 1);
        else next.setDate(pivotDate.getDate() + 7);
        setPivotDate(next);
      };

      const handleToday = () => {
        const t = new Date();
        setPivotDate(t);
        setSelectedDate(t.toISOString().split("T")[0]);
      };

      const formatDateStr = (d) => {
        const pad = (n) => (n < 10 ? "0" : "") + n;
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      };

      const getTodosForDate = (dateStr) => {
        return todos.filter(t => t.dueDate === dateStr);
      };

      const selectedDateTodos = useMemo(() => {
        return getTodosForDate(selectedDate);

                    >
                      <div className="flex items-center justify-between">
                        <span className={`text-xs font-extrabold ${isToday ? "h-5 w-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px]" : d.getDay() === 0 ? "text-rose-500" : d.getDay() === 6 ? "text-blue-500" : "text-slate-700"}`}>
                          {d.getDate()}
                        </span>
                        {dayTodos.length > 0 && (
                          <span className={`text-[9px] font-black px-1.5 py-0.2 rounded-full ${activeCount > 0 ? "bg-emerald-500 text-white" : "bg-slate-200 text-slate-600"}`}>
                            {dayTodos.length}
                          </span>

                      </div>

                      {/* Mini Todo Indicators */}
                      <div className="space-y-0.5 mt-1 overflow-hidden max-h-10">
                        {dayTodos.slice(0, 2).map(t => (
                          <div key={t.id} className={`text-[9px] truncate px-1 rounded font-medium ${t.completed ? "line-through text-slate-400 bg-slate-100" : "text-emerald-900 bg-emerald-100/70"}`}>
                            {t.title}

                        ))}
                        {dayTodos.length > 2 && (
                          <div className="text-[8px] text-slate-400 font-bold text-right">+{dayTodos.length - 2}개</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              /* Week View */
              <div className="grid grid-cols-7 gap-1.5 mt-2">
                {weekDays.map(d => {
                  const dateStr = formatDateStr(d);

                  const dayTodos = getTodosForDate(dateStr);

                  return (
                    <div 
                      key={dateStr}

                      <div className="space-y-1 mt-1 flex-1 overflow-y-auto max-h-28 custom-scrollbar">
                        {dayTodos.map(t => (

                            {t.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Selected Date Todo Details Panel */}
          <div className="glass-card rounded-3xl p-6 shadow-lg border border-white/80 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-150 pb-3">
              <div>
                <h4 className="text-base font-extrabold text-slate-850 flex items-center gap-2">
                  <span>📌</span> {selectedDate} 날짜의 일정 목록 ({selectedDateTodos.length}건)

                <p className="text-xs text-slate-500 mt-0.5">달력에서 선택한 날짜에 등록된 계획 및 목표입니다.</p>

              <button

      const [isAlarmModalOpen, setIsAlarmModalOpen] = useState(false);
      const [tempAlarmDate, setTempAlarmDate] = useState("");
      const [tempAlarmAmpm, setTempAlarmAmpm] = useState("AM");
      const [tempAlarmHour, setTempAlarmHour] = useState(9);
      const [tempAlarmMinute, setTempAlarmMinute] = useState(0);
      const [alarmRepeat, setAlarmRepeat] = useState("none");
      const [alarmRepeatDays, setAlarmRepeatDays] = useState([]);
      const [alarmRepeatInterval, setAlarmRepeatInterval] = useState(30);
      const [alarmSound, setAlarmSound] = useState("zen_bell");
      const [subtasks, setSubtasks] = useState([]);
      const [newSubtaskText, setNewSubtaskText] = useState("");

      // Edit Modal State
      const [editingTodo, setEditingTodo] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editDescription, setEditDescription] = useState("");
      const [editCategory, setEditCategory] = useState("Work");
      const [editPriority, setEditPriority] = useState("medium");
      const [editDueDate, setEditDueDate] = useState("");
      const [editAlarmTime, setEditAlarmTime] = useState("");
      const [isEditAlarmModalOpen, setIsEditAlarmModalOpen] = useState(false);
      const [editTempAlarmDate, setEditTempAlarmDate] = useState("");
      const [editTempAlarmAmpm, setEditTempAlarmAmpm] = useState("AM");
      const [editTempAlarmHour, setEditTempAlarmHour] = useState(9);
      const [editTempAlarmMinute, setEditTempAlarmMinute] = useState(0);
      const [editAlarmRepeat, setEditAlarmRepeat] = useState("none");
      const [editAlarmRepeatDays, setEditAlarmRepeatDays] = useState([]);
      const [editAlarmRepeatInterval, setEditAlarmRepeatInterval] = useState(30);
      const [editAlarmSound, setEditAlarmSound] = useState("zen_bell");
      const [editSubtasks, setEditSubtasks] = useState([]);
      const [editNewSubtaskText, setEditNewSubtaskText] = useState("");

      // Active Ringing Alarm State
      const [activeAlarmTodo, setActiveAlarmTodo] = useState(null);
      const [audioStopper, setAudioStopper] = useState(null);
      const [toast, setToast] = useState(null);

      // Download Center Modal & Device View Mode
      const [isDownloadModalOpen, setIsDownloadModalOpen] = useState(false);
      const [deviceViewMode, setDeviceViewMode] = useState("pc");

      // 🌿 Mind Healing Journal & AI Diagnosis States
      const [healingTab, setHealingTab] = useState("journal");
      const [journalEntries, setJournalEntries] = useState(() => {
        try {
          const saved = localStorage.getItem("3d_glass_planner_journal_entries");
          return saved ? JSON.parse(saved) : [
            {
              id: "initial-journal-1",
              date: new Date().toISOString().split("T")[0],
              mood: "calm",
              gratitude: "오늘 하루도 차근차근 계획대로 소화할 수 있어 감사한 마음입니다.",
              content: "마음이 조급할 때는 잠시 숨을 고르고 가장 중요한 일부터 하나씩 해결해 나가려고 합니다. 나만의 속도로 성장하는 중!",
              createdAt: new Date().toISOString()
            }
          ];
        } catch (e) {
          return [];
        }
      });
      const [currentMood, setCurrentMood] = useState("calm");
      const [gratitudeText, setGratitudeText] = useState("");
      const [journalContent, setJournalContent] = useState("");
      const [isAddingJournal, setIsAddingJournal] = useState(false);
      const [showConfigGuide, setShowConfigGuide] = useState(false);

      const [isDiagnosing, setIsDiagnosing] = useState(false);
      const [diagnosisResult, setDiagnosisResult] = useState(null);

      const saveJournals = (newEntries) => {
        setJournalEntries(newEntries);
        try {
          localStorage.setItem("3d_glass_planner_journal_entries", JSON.stringify(newEntries));
        } catch (e) {}
      };

      // Save Todos
      const saveTodos = (newTodos) => {
        setTodos(newTodos);
        try {
          localStorage.setItem("3d_glass_todos", JSON.stringify(newTodos));
        } catch (e) {}
      };

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Realtime Alarm Check Loop
      useEffect(() => {
        const interval = setInterval(() => {
          if (activeAlarmTodo) return;
          const now = new Date();
          const currentISO = toLocalISOString(now);

          const triggered = todos.find(t => {
            if (t.completed || !t.alarmTime || t.alarmDismissed) return false;
            return t.alarmTime <= currentISO;
          });

          if (triggered) {
            setActiveAlarmTodo(triggered);
            const stop = playAlarmSound(triggered.alarmSound || "zen_bell");
            setAudioStopper(() => stop);

            if ("Notification" in window && Notification.permission === "granted") {
              try {
                new Notification("⏰ [" + triggered.title + "] 알람 시각 도달", {
                  body: triggered.description || "등록된 일정 알람 시각입니다.",
                  icon: "./icon.png"
                });
              } catch (e) {}
            }
          }
        }, 4000);
        return () => clearInterval(interval);
      }, [todos, activeAlarmTodo]);

      // Request notification on mount
      useEffect(() => {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }, []);

      // Alarm Dismiss / Snooze
      const handleDismissAlarm = (todoId) => {
        if (audioStopper) {
          audioStopper();
          setAudioStopper(null);
        }
        setActiveAlarmTodo(null);

        const updated = todos.map(t => {
          if (t.id === todoId) {
            if (t.alarmRepeat && t.alarmRepeat !== "none") {
              const nextTime = getNextAlarmTime(t.alarmTime, t.alarmRepeat, t.alarmRepeatDays, new Date(), t.alarmRepeatInterval);
              if (nextTime) {
                return { ...t, alarmTime: nextTime, alarmDismissed: false };
              }
            }
            return { ...t, alarmDismissed: true };
          }
          return t;
        });
        saveTodos(updated);
        showToast("알람을 확인 완료 처리했습니다.");
      };

      const handleSnoozeAlarm = (todoId) => {
        if (audioStopper) {
          audioStopper();
          setAudioStopper(null);
        }
        setActiveAlarmTodo(null);

        const snoozeTime = toLocalISOString(new Date(Date.now() + 5 * 60000));
        const updated = todos.map(t => {
          if (t.id === todoId) {
            return { ...t, alarmTime: snoozeTime, alarmDismissed: false };
          }
          return t;
        });
        saveTodos(updated);
        showToast("알람을 5분 뒤로 연기했습니다 (스누즈).", "info");
      };

      // Add Subtask Handlers
      const handleAddSubtask = (e) => {
        e.preventDefault();
        if (!newSubtaskText.trim()) return;
        setSubtasks([...subtasks, { id: Math.random().toString(36).substr(2, 9), text: newSubtaskText.trim(), completed: false }]);
        setNewSubtaskText("");
      };

      const handleAddEditSubtask = (e) => {
        e.preventDefault();
        if (!editNewSubtaskText.trim()) return;
        setEditSubtasks([...editSubtasks, { id: Math.random().toString(36).substr(2, 9), text: editNewSubtaskText.trim(), completed: false }]);
        setEditNewSubtaskText("");
      };

      // Confirm Alarm Time Selection
      const confirmAlarmTime = () => {
        const finalDate = tempAlarmDate || dueDate || new Date().toISOString().split("T")[0];
        let h24 = tempAlarmHour;
        if (tempAlarmAmpm === "PM" && tempAlarmHour < 12) h24 += 12;
        if (tempAlarmAmpm === "AM" && tempAlarmHour === 12) h24 = 0;
        const timeStr = h24.toString().padStart(2, "0") + ":" + tempAlarmMinute.toString().padStart(2, "0");
        setAlarmTime(finalDate + "T" + timeStr);
        setIsAlarmModalOpen(false);
      };

      const confirmEditAlarmTime = () => {
        const finalDate = editTempAlarmDate || editDueDate || new Date().toISOString().split("T")[0];
        let h24 = editTempAlarmHour;
        if (editTempAlarmAmpm === "PM" && editTempAlarmHour < 12) h24 += 12;
        if (editTempAlarmAmpm === "AM" && editTempAlarmHour === 12) h24 = 0;
        const timeStr = h24.toString().padStart(2, "0") + ":" + editTempAlarmMinute.toString().padStart(2, "0");
        setEditAlarmTime(finalDate + "T" + timeStr);
        setIsEditAlarmModalOpen(false);
      };

      // Open Edit Modal
      const handleOpenEdit = (todo) => {
        setEditingTodo(todo);
        setEditTitle(todo.title);
        setEditDescription(todo.description || "");
        setEditCategory(todo.category);
        setEditPriority(todo.priority);
        setEditDueDate(todo.dueDate || "");
        setEditAlarmTime(todo.alarmTime || "");
        setEditAlarmRepeat(todo.alarmRepeat || "none");
        setEditAlarmRepeatDays(todo.alarmRepeatDays || []);
        setEditAlarmRepeatInterval(todo.alarmRepeatInterval || 30);
        setEditAlarmSound(todo.alarmSound || "zen_bell");
        setEditSubtasks(todo.subtasks || []);

        if (todo.alarmTime) {
          const parts = todo.alarmTime.split("T");
          setEditTempAlarmDate(parts[0] || "");
          if (parts[1]) {
            const timeSub = parts[1].split(":");
            const h = parseInt(timeSub[0], 10);
            const m = parseInt(timeSub[1], 10);
            setEditTempAlarmAmpm(h >= 12 ? "PM" : "AM");
            setEditTempAlarmHour(h % 12 === 0 ? 12 : h % 12);
            setEditTempAlarmMinute(m || 0);
          }
        }
      };

      // Submit Create Todo
      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const newTodo = {
          id: Math.random().toString(36).substr(2, 9),
          title: title.trim(),
          description: description.trim() || undefined,
          completed: false,
          category,
          priority,
          dueDate: dueDate || undefined,
          subtasks,
          alarmTime: alarmTime || undefined,
          alarmRepeat: alarmTime ? alarmRepeat : "none",
          alarmRepeatDays: alarmTime && alarmRepeat === "weekly" ? alarmRepeatDays : undefined,
          alarmRepeatInterval: alarmTime && (alarmRepeat === "minute" || alarmRepeat === "hour") ? alarmRepeatInterval : undefined,
          alarmSound: alarmTime ? alarmSound : undefined,
          createdAt: new Date().toISOString()
        };

        saveTodos([newTodo, ...todos]);
        setTitle("");
        setDescription("");
        setCategory("Work");
        setPriority("medium");
        setDueDate("");
        setAlarmTime("");
        setAlarmRepeat("none");
        setAlarmRepeatDays([]);
        setAlarmRepeatInterval(30);
        setSubtasks([]);
        setIsFormOpen(false);
        showToast("새로운 계획이 성공적으로 등록되었습니다!");
      };

      // Submit Save Edit Todo
      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editTitle.trim() || !editingTodo) return;

        const updated = todos.map(t => {
          if (t.id === editingTodo.id) {
            return {
              ...t,
              title: editTitle.trim(),
              description: editDescription.trim() || undefined,
              category: editCategory,
              priority: editPriority,
              dueDate: editDueDate || undefined,
              subtasks: editSubtasks,
              alarmTime: editAlarmTime || undefined,
              alarmRepeat: editAlarmTime ? editAlarmRepeat : "none",
              alarmRepeatDays: editAlarmTime && editAlarmRepeat === "weekly" ? editAlarmRepeatDays : undefined,
              alarmRepeatInterval: editAlarmTime && (editAlarmRepeat === "minute" || editAlarmRepeat === "hour") ? editAlarmRepeatInterval : undefined,
              alarmSound: editAlarmTime ? editAlarmSound : undefined,
              alarmDismissed: false
            };
          }
          return t;
        });

        saveTodos(updated);
        setEditingTodo(null);
        showToast("계획 세부 설정이 수정되었습니다!");
      };

      // Toggle Complete
      const handleToggleComplete = (id) => {
        const updated = todos.map(t => {
          if (t.id === id) {
            const nextDone = !t.completed;
            if (nextDone && window.confetti) {
              window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            }
            return {
              ...t,
              completed: nextDone,
              completedAt: nextDone ? new Date().toISOString() : undefined,
              subtasks: t.subtasks ? t.subtasks.map(s => ({ ...s, completed: nextDone })) : []
            };
          }
          return t;
        });
        saveTodos(updated);
      };

      const handleDeleteTodo = (id) => {
        const target = todos.find(t => t.id === id);
        if (confirm(`'${target?.title || "선택한 일정"}'을(를) 삭제하시겠습니까?`)) {
          saveTodos(todos.filter(t => t.id !== id));
          showToast("일정을 삭제했습니다.");
        }
      };

      // Quick triggers from other views
      const handleAddTodoForDate = (dateStr) => {
        setDueDate(dateStr);
        setTempAlarmDate(dateStr);
        setIsFormOpen(true);
        window.scrollTo({ top: 150, behavior: "smooth" });
      };

      const handleAddTodoForCategory = (catKey) => {
        setCategory(catKey);
        setIsFormOpen(true);
        window.scrollTo({ top: 150, behavior: "smooth" });
      };

      // 🌿 Journal Handlers
      const handleSaveJournal = (e) => {
        e.preventDefault();
        if (!journalContent.trim() && !gratitudeText.trim()) {
          showToast("감사한 일이나 오늘 하루 일기 내용을 작성해 주세요.", "info");
          return;
        }
        const todayStr = new Date().toISOString().split("T")[0];
        const newEntry = {
          id: "journal-" + Date.now(),
          date: todayStr,
          mood: currentMood,
          gratitude: gratitudeText.trim() || undefined,
          content: journalContent.trim(),
          createdAt: new Date().toISOString()
        };
        const updated = [newEntry, ...journalEntries];
        saveJournals(updated);
        setGratitudeText("");
        setJournalContent("");
        setIsAddingJournal(false);
        showToast("🌿 마음 힐링 저널이 안전하게 저장되었습니다!", "success");
      };

      const handleDeleteJournal = (id) => {
        const updated = journalEntries.filter(entry => entry.id !== id);
        saveJournals(updated);
        showToast("저널 기록이 삭제되었습니다.", "info");
      };

      // ⚡ AI / Local Heuristic Diagnosis Runner
      const handleRunDiagnosis = async () => {
        setIsDiagnosing(true);
        showToast("🤖 AI 모델이 일정 균형 및 생산성을 정밀 진단 중입니다...", "info");

        // Try API if online, otherwise fallback to heuristic
        try {
          const res = await fetch("/api/planner/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ todos })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.analysis) {
              setDiagnosisResult({
                feedback: data.analysis.feedback,
                tips: data.analysis.tips || [],
                suggestions: data.analysis.suggestions || [],
                analyzedAt: new Date().toLocaleTimeString(),
                isOffline: false
              });
              showToast("✨ Gemini AI 정밀 진단 보고서가 도착했습니다!", "success");
              setIsDiagnosing(false);
              return;
            }
          }
        } catch (e) {}

        // Fallback Heuristic
        setTimeout(() => {
          const totalCount = todos.length;
          const completedCount = todos.filter(t => t.completed).length;
          const activeTodos = todos.filter(t => !t.completed);
          const highPriorityCount = activeTodos.filter(t => t.priority === "high").length;
          const completionRate = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

          let feedback = "";
          if (totalCount === 0) {
            feedback = "현재 등록된 일정이 없습니다. 오늘 꼭 이루고 싶은 핵심 목표 1~2가지를 가볍게 추가해 하루를 시작해 보세요!";
          } else if (completionRate >= 70) {
            feedback = `전체 ${totalCount}개 일정 중 ${completedCount}개(${completionRate}%)를 완수하셨습니다! 뛰어난 실행력과 집중력을 발휘하셨으며, 저녁 시간대에는 온전한 휴식을 권장합니다.`;
          } else if (highPriorityCount >= 3) {
            feedback = `긴급/중요도가 높은 일정이 ${highPriorityCount}개 집중되어 있습니다. 오전 시간에 가장 핵심적인 과제 1개를 먼저 완수하고 나머지는 순차적으로 분산하세요.`;
          } else {
            feedback = `총 ${activeTodos.length}개의 진행 중인 일정이 잘 정돈되어 있습니다. 우선순위대로 하나씩 완료 체크해 나가면 안정적인 성취감을 얻을 수 있습니다.`;
          }

          setDiagnosisResult({
            feedback,
            tips: [
              { title: "25분 집중 + 5분 이완 (뽀모도로)", description: "높은 집중력이 필요한 작업은 25분간 몰입한 뒤 5분간 가볍게 스트레칭을 병행하세요." },
              { title: "하루 3대 핵심 과제 (Rule of 3)", description: "오늘 반드시 끝낼 가장 가치 있는 3가지 작업에 먼저 집중하세요." }
            ],
            suggestions: [
              {
                title: "업무 중간 10분 마인드 리셋 & 눈 스트레칭",
                description: "장시간 집중으로 인한 피로를 덜기 위한 가벼운 이완 시간",
                category: "Health",
                priority: "medium",
                dueDateOffset: 0,
                subtasks: ["인공눈물 넣기", "먼 산 바라보며 심호흡 5회"]
              },
              {
                title: "내일 아침을 위한 5분 데스크 정리 & 일정 프리뷰",
                description: "하루를 마감하며 내일 할 일을 3줄로 미리 훑어보는 습관",
                category: "Personal",
                priority: "low",
                dueDateOffset: 1,
                subtasks: ["책상 위 컵 정리", "내일 1순위 할 일 캘린더 확인"]
              }
            ],
            analyzedAt: new Date().toLocaleTimeString(),
            isOffline: true
          });
          showToast("💡 로컬 정밀 진단 분석이 완료되었습니다.", "success");
          setIsDiagnosing(false);
        }, 600);
      };

      const handleAddTodoFromAISuggestion = (sug) => {
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + (sug.dueDateOffset || 0));
        const dueDateStr = targetDate.toISOString().split("T")[0];

        const newTodo = {
          id: "ai-todo-" + Date.now(),
          title: sug.title,
          description: sug.description,
          category: sug.category || "Work",
          priority: sug.priority || "medium",
          dueDate: dueDateStr,
          completed: false,
          createdAt: new Date().toISOString(),
          subtasks: (sug.subtasks || []).map((stText, idx) => ({
            id: `ai-sub-${Date.now()}-${idx}`,
            text: stText,
            completed: false
          }))
        };

        saveTodos([newTodo, ...todos]);
        showToast(`🎯 '${sug.title}' 일정이 플래너에 추가되었습니다!`, "success");
      };

      // Export JSON backup (Todos + Journals)
      const handleExportJSON = () => {
        const backupData = {
          todos,
          journals: journalEntries,
          backupDate: new Date().toISOString(),
          version: "1.0"
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const anchor = document.createElement("a");
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `3d_planner_backup_${new Date().toISOString().split("T")[0]}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        showToast("일정 및 저널 백업 파일(JSON)을 다운로드했습니다.");
      };

      // Import JSON backup
      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              saveTodos(imported);
              showToast(`성공적으로 ${imported.length}개의 일정을 복원했습니다!`);
            } else if (imported && Array.isArray(imported.todos)) {
              saveTodos(imported.todos);
              if (Array.isArray(imported.journals)) {
                saveJournals(imported.journals);
              }
              showToast(`성공적으로 ${imported.todos.length}개의 일정과 저널을 복원했습니다!`);
            } else {
              showToast("유효한 일정 백업 JSON 파일이 아닙니다.", "error");
            }
          } catch (err) {
            showToast("파일을 읽는 도중 오류가 발생했습니다.", "error");
          }
        };
        reader.readAsText(file);
      };

      // Filtered Todos for List View
      const filteredTodos = useMemo(() => {
        return todos.filter(t => {
          const matchCat = selectedCategory === "All" || t.category === selectedCategory;
          const matchSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || (t.description && t.description.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchStatus = statusFilter === "All" || (statusFilter === "Completed" && t.completed) || (statusFilter === "Active" && !t.completed);
          return matchCat && matchSearch && matchStatus;
        }).sort((a, b) => {
          if (sortBy === "dueDate") {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return new Date(a.dueDate) - new Date(b.dueDate);
          }
          if (sortBy === "priority") {
            const pMap = { high: 3, medium: 2, low: 1 };
            return pMap[b.priority] - pMap[a.priority];
          }
          if (sortBy === "latest") {
            return new Date(b.createdAt) - new Date(a.createdAt);
          }
          return 0;
        });
      }, [todos, selectedCategory, searchQuery, statusFilter, sortBy]);

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-8 pb-24">
          
          {/* Top Bar with Icon, Title, Sub-actions (Google Calendar & Dark Mode) and Dev Tools button */}

                  </a>

                  <a 
                    href="/api/download/standalone-html"

                    className="w-full py-2.5 px-3.5 rounded-xl border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 font-extrabold text-xs shadow-xs transition-all flex items-center justify-between no-underline"
                  >
                    <span className="flex items-center gap-2">⚡ 단독 실행 HTML 파일 (.HTML)</span>

                  <a 
                    href="/api/download/source-code-zip"
                    download="3D_Planner_Source_Code.zip"
                    className="w-full py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-xs shadow-xs transition-all flex items-center justify-between no-underline"

                    <span className="flex items-center gap-2">📁 전체 소스코드 패키지 (.ZIP)</span>
                    <span className="text-[10px] bg-slate-700 px-2 py-0.5 rounded-md">TypeScript</span>

                  <a

                  >
                    <span className="flex items-center gap-2">✨ 변경된 핵심 파일 모음 (.ZIP)</span>
                    <span className="text-[10px] bg-indigo-500 px-2 py-0.5 rounded-md">수정본</span>
                  </a>

                  <a 
                    href="/api/download-icons-zip"
                    download="3D_Planner_Icons_Pack.zip"

                    <span className="flex items-center gap-2">🎨 3D 아이콘 전체 팩 (.ZIP)</span>

                </div>

                <div className="pt-2 text-right">
                  <button

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2">

    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
